<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>lauraboccio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <link rel="stylesheet" href="css/room-editor.css" />
</head>
<body data-room="home" data-base="" data-width="1366" data-height="768" data-background="assets/images/homepage-elements/brick.png">
  <div id="sidebar">
    <h2>Layers</h2>
    <p class="sidebar-hint">Drag to reorder — top is front</p>
    <ul id="canvas-items-list" class="layer-list"></ul>

    <h2>Add to Room</h2>
    <ul id="inventory-list"></ul>
  </div>
  <div id="canvas-wrapper">
    <canvas id="room-canvas"></canvas>
    <div class="toolbar">
      <button id="edit-toggle">Edit</button>
      <button id="undo-btn" class="edit-mode-only" disabled>Undo</button>
      <button id="redo-btn" class="edit-mode-only" disabled>Redo</button>
      <button id="reset-layout" class="edit-mode-only">Reset Layout</button>
    </div>
    <div id="selection-panel" class="floating-panel"></div>
  </div>
  <div id="link-confirm-overlay" class="modal-overlay">
    <div class="modal-box">
      <p id="link-confirm-text"></p>
      <p id="link-confirm-url" class="modal-url"></p>
      <div class="modal-buttons">
        <button id="link-confirm-go">Continue</button>
        <button id="link-confirm-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <script type="module" src="js/room-editor.js"></script>
</body>
</html>
