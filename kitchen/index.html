<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kitchen | lauraboccio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: sans-serif; background: #111; color: #fff; }
    body { display: flex; }
    #sidebar { width: 280px; background: #1a1a1a; padding: 16px; overflow-y: auto; height: 100vh; }
    #sidebar h2 { font-size: 16px; margin-bottom: 12px; }
    #inventory-list { list-style: none; }
    #inventory-list li { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
    #inventory-list img { width: 48px; height: 48px; object-fit: cover; border-radius: 4px; background: #333; }
    .item-info { flex: 1; }
    .item-name { font-size: 13px; font-weight: bold; }
    .item-brand { font-size: 11px; color: #999; }
    .item-info button { margin-top: 4px; font-size: 11px; padding: 2px 6px; cursor: pointer; }
    .status { font-size: 10px; color: #6cf; margin-left: 4px; }
    #canvas-wrapper { flex: 1; height: 100vh; background: #2b2b2b; position: relative; }
  </style>
</head>
<body data-room="kitchen">
  <div id="sidebar">
    <h2>Inventory</h2>
    <ul id="inventory-list"></ul>
  </div>
  <div id="canvas-wrapper">
    <canvas id="room-canvas"></canvas>
  </div>
  <script type="module" src="../js/room-editor.js"></script>
</body>
</html>
